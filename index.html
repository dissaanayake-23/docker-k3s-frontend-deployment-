<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A frontend web application containerized using Docker and deployed using K3s."
    >

    <title>Docker Containerization</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="hero">

            <div class="hero-content">

                <p class="tag">
                    Docker + K3s Deployment
                </p>

                <h1>
                    Build.
                    <span>Containerize.</span>
                    Deploy V2.
                </h1>

                <p class="description">
                    A simple frontend application containerized with Docker
                    and deployed using K3s Kubernetes.
                </p>

            </div>

        </section>

        <section
            class="deployment-card"
            aria-label="Docker deployment terminal"
        >

            <div class="terminal-header">

                <span></span>
                <span></span>
                <span></span>

            </div>

            <div class="terminal-body">

                <p>
                    <span>$</span>
                    docker build -t frontend-app .
                </p>

                <p>
                    <span>$</span>
                    kubectl apply -f deployment.yaml
                </p>

                <p>
                    <span>$</span>
                    kubectl get pods
                </p>

                <p class="success">
                    ✓ Frontend successfully deployed
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
